name: team-task-tracker

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-secret_key}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-task_tracker}
      MYSQL_USER: ${MYSQL_USER:-task_tracker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-task_tracker_password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    restart: "no"
    environment:
      GOOSE_DRIVER: mysql
      GOOSE_DBSTRING: "${MYSQL_USER:-task_tracker}:${MYSQL_PASSWORD:-task_tracker_password}@tcp(mysql:3306)/${MYSQL_DATABASE:-task_tracker}?parseTime=true&multiStatements=true"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-task_tracker}
      MYSQL_USER: ${MYSQL_USER:-task_tracker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-task_tracker_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data:
